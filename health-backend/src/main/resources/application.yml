server:
  port: 8080

spring:
  application:
    name: health-platform
  datasource:
    url: jdbc:sqlite:health.db
    driver-class-name: org.sqlite.JDBC
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  sql:
    init:
      mode: always
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml

# Sa-Token Configuration
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-share: false
  token-style: uuid
  is-log: true

# Springdoc Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
custom:
  upload-path: src/main/resources/uploads/
  upload-url-prefix: http://localhost:8080/uploads/

ai:
  provider: openai-compatible
  base-url: https://openrouter.ai/api/v1
  chat-path: /chat/completions
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:google/gemma-3-27b-it:free}
  app-name: tbw-health-platform
  site-url: http://localhost:3000
